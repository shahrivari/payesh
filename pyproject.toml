[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "payesh"
version = "0.1.0"
description = "A Python application for monitoring and collecting data from web sources"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115",
    "jdatetime>=5.2",
    "openpyxl>=3.1",
    "pypdf>=6.20.0",
    "xlrd>=2.0",
    "uvicorn>=0.34",
]

[project.scripts]
payesh-web = "payesh.web:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.hatch.build.targets.wheel]
packages = ["src/payesh"]
